name: Build LaTeX PDF with Bibliography and Upload as Release Asset

on:
  push:
    paths:
      - 'DividedCities_pp/paper.tex'
      - 'DividedCities_pp/reference.bib'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Install TeX Live
      run: |
        sudo apt-get update
        sudo apt-get install -y texlive-latex-recommended \
                                texlive-latex-extra \
                                texlive-bibtex-extra \
                                texlive-fonts-recommended \
                                latexmk

    - name: Compile LaTeX with Bibliography
      run: |
        set -e
        cd DividedCities_pp
        pdflatex -interaction=nonstopmode paper.tex
        bibtex paper
        pdflatex -interaction=nonstopmode paper.tex
        pdflatex -interaction=nonstopmode paper.tex

    - name: Create GitHub Release
      uses: actions/create-release@v1
      with:
        tag_name: v1.0  # Adjust version as needed
        release_name: "Compiled Paper PDF"
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload PDF to Release
      run: |
        gh release upload v1.0 DividedCities_pp/paper.pdf --clobber
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
