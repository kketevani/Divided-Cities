name: Build LaTeX PDF and Publish to Public Repo

on:
  push:
    paths:
      - 'DividedCities_pp/paper.tex'
      - 'DividedCities_pp/reference.bib'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the Repository
    - name: Checkout Repository
      uses: actions/checkout@v3

    # Step 2: Install TeX Live
    - name: Install TeX Live
      run: |
        sudo apt-get update
        sudo apt-get install -y texlive-latex-recommended \
                                texlive-latex-extra \
                                texlive-bibtex-extra \
                                texlive-fonts-recommended \
                                latexmk

    # Step 3: Compile the LaTeX Document
    - name: Compile LaTeX with Bibliography
      run: |
        cd DividedCities_pp
        pdflatex -interaction=nonstopmode paper.tex
        bibtex paper
        pdflatex -interaction=nonstopmode paper.tex
        pdflatex -interaction=nonstopmode paper.tex

    # Step 4: Push the PDF to the Public Repository
    - name: Push PDF to Public Repository
      run: |
        # Clone the public repository with authentication
        git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/kketevani/public.git public-repo
        # Move the compiled PDF to the repository
        cp DividedCities_pp/paper.pdf public-repo/paper.pdf
        cd public-repo
        # Configure Git
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        # Commit and push changes
        git add paper.pdf
        git commit -m "Update paper.pdf from build [ci skip]" || echo "No changes to commit"
        git push origin main
  env:
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
