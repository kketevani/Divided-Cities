name: Build LaTeX PDF and Create or Update Release

on:
  push:
    paths:
      - 'DividedCities_pp/paper.tex'
      - 'DividedCities_pp/reference.bib'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Install TeX Live
      run: |
        sudo apt-get update
        sudo apt-get install -y texlive-latex-recommended \
                                texlive-latex-extra \
                                texlive-bibtex-extra \
                                texlive-fonts-recommended \
                                latexmk

    - name: Compile LaTeX with Bibliography
      run: |
        set -e
        cd DividedCities_pp
        pdflatex -interaction=nonstopmode paper.tex
        bibtex paper
        pdflatex -interaction=nonstopmode paper.tex
        pdflatex -interaction=nonstopmode paper.tex

    - name: Install GitHub CLI
      run: |
        sudo apt-get update
        sudo apt-get install -y gh

    - name: Check if Release Exists and Create if Necessary
      run: |
        if ! gh release view v1.0 > /dev/null 2>&1; then
          echo "Release v1.0 does not exist. Creating it now."
          gh release create v1.0 --notes "Compiled paper release."
        else
          echo "Release v1.0 exists. Proceeding to update it."
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload PDF to Release
      run: |
        gh release upload v1.0 DividedCities_pp/paper.pdf --clobber
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}    < when I open paper.pdf it automatically downloads, is it possible to avoid this
