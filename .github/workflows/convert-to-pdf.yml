name: Build LaTeX PDF, Update Release, and Commit to Public Repo

on:
  push:
    paths:
      - 'DividedCities_pp/paper.tex'
      - 'DividedCities_pp/reference.bib'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout Repository
    - name: Checkout Repository
      uses: actions/checkout@v3

    # Step 2: Install TeX Live
    - name: Install TeX Live
      run: |
        sudo apt-get update
        sudo apt-get install -y texlive-latex-recommended \
                                texlive-latex-extra \
                                texlive-bibtex-extra \
                                texlive-fonts-recommended \
                                latexmk

    # Step 3: Compile LaTeX Document
    - name: Compile LaTeX with Bibliography
      run: |
        cd DividedCities_pp
        pdflatex -interaction=nonstopmode paper.tex
        bibtex paper
        pdflatex -interaction=nonstopmode paper.tex
        pdflatex -interaction=nonstopmode paper.tex

    # Step 4: Update GitHub Release
    - name: Install GitHub CLI
      run: |
        sudo apt-get update
        sudo apt-get install -y gh

    - name: Check if Release Exists and Create if Necessary
      run: |
        if ! gh release view v1.0 > /dev/null 2>&1; then
          echo "Release v1.0 does not exist. Creating it now."
          gh release create v1.0 --notes "Compiled paper release."
        else
          echo "Release v1.0 exists. Proceeding to update it."
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload PDF to Release
      run: |
        gh release upload v1.0 DividedCities_pp/paper.pdf --clobber
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Step 5: Clone Public Repository and Push PDF
    - name: Clone Public Repository
      run: |
        git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/kketevani/public.git public-repo
        mv DividedCities_pp/paper.pdf public-repo/paper.pdf
        cd public-repo
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add paper.pdf
        git commit -m "Update paper.pdf from build [ci skip]"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
