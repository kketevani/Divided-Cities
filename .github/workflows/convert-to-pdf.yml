name: Build LaTeX PDF with Bibliography

on:
  push:
    paths:
      - 'DividedCities_pp/paper.tex'
      - 'DividedCities_pp/reference.bib'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Install Minimal TeX Live
      run: |
        sudo apt-get update
        sudo apt-get install -y texlive-latex-recommended texlive-bibtex-extra \
                                texlive-fonts-recommended latexmk

    - name: Compile LaTeX with Bibliography
      run: |
        set -e                                
        cd DividedCities_pp
        pdflatex -interaction=nonstopmode paper.tex
        bibtex paper
        pdflatex -interaction=nonstopmode paper.tex
        pdflatex -interaction=nonstopmode paper.tex

    - name: Upload PDF as Artifact (Not Zipped)
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Paper
        path: DividedCities_pp/paper.pdf        # Upload the single PDF file
        if-no-files-found: error                # Error out if PDF isn't found
        retention-days: 7                       # Optional: Adjust retention days
