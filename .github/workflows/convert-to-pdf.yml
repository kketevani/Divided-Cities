name: Build LaTeX PDF and Update Repository

on:
  push:
    paths:
      - 'DividedCities_pp/paper.tex'
      - 'DividedCities_pp/reference.bib'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Install TeX Live
      run: |
        sudo apt-get update
        sudo apt-get install -y texlive-latex-recommended \
                                texlive-latex-extra \
                                texlive-bibtex-extra \
                                texlive-fonts-recommended \
                                latexmk

    - name: Compile LaTeX with Bibliography
      run: |
        set -e
        cd DividedCities_pp
        pdflatex -interaction=nonstopmode paper.tex
        bibtex paper
        pdflatex -interaction=nonstopmode paper.tex
        pdflatex -interaction=nonstopmode paper.tex

    - name: Commit PDF to Repository
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        mv DividedCities_pp/paper.pdf paper.pdf  # Move the PDF to the repository root
        git add paper.pdf
        git commit -m "Update compiled PDF [ci skip]"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
